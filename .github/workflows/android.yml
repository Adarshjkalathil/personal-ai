name: Build the Android app

# Builds the APK on every push and pull request. When package.json has a version
# that hasn't been released yet, a push to main publishes it as a GitHub release,
# which the app checks for updates.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Every release must be signed with the same key, or phones refuse to install it as an update.
      # Without the key (e.g. pull requests from forks) a debug APK is built instead.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run build:android

      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          chmod +x gradlew
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.p12" ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../personal-ai.apk

      - name: Build debug APK (no signing key)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../personal-ai.apk

      - uses: actions/upload-artifact@v7
        with:
          name: personal-ai-apk
          path: personal-ai.apk

      - name: Publish a release for a new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "$version is already released; bump the version in package.json to publish a new one."
            exit 0
          fi
          gh release create "$version" personal-ai.apk --title "Personal AI $version for Android" --notes "Install on Android: download **personal-ai.apk** below on your phone, open it, and allow installing from your browser when asked. To update, install the new APK over the old one: your conversations, tasks and keys are kept.

          Built from ${GITHUB_SHA::7}."
